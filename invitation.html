<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#183c34">
    <title>Wedding Invitation | Ruth &amp; Kevin</title>
    <style>
        :root {
            color-scheme: light;
            --forest: #183c34;
            --cream: #f5f2e9;
            --coral: #c76f59;
            --serif: 'Playfair Display', Georgia, serif;
            --sans: 'DM Sans', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 32px 18px;
            background: #e8e4d9;
            color: var(--forest);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        .toolbar {
            position: fixed;
            z-index: 1;
            top: 16px;
            right: 18px;
            display: flex;
            gap: 10px;
        }

        .toolbar a,
        .toolbar button {
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--forest);
            background: var(--cream);
            color: var(--forest);
            font: 500 12px var(--sans);
            text-decoration: none;
            cursor: pointer;
        }

        .toolbar button {
            background: var(--forest);
            color: #fffdf6;
        }

        .invitation {
            position: relative;
            display: flex;
            width: min(100%, 720px);
            min-height: 820px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 80px 48px;
            border: 1px solid #d4c8b7;
            background: var(--cream);
            text-align: center;
        }

        .invitation::before,
        .invitation::after {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px solid #d4c8b7;
            border-radius: 50%;
            content: '';
        }

        .invitation::before {
            top: -125px;
            left: -125px;
        }

        .invitation::after {
            right: -125px;
            bottom: -125px;
        }

        .eyebrow {
            margin: 0 0 24px;
            color: var(--coral);
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: var(--serif);
            font-size: clamp(48px, 8vw, 76px);
            font-weight: 400;
            line-height: 1.12;
        }

        h1 span {
            color: var(--coral);
            font-style: italic;
        }

        .invitation__message {
            max-width: 430px;
            margin: 25px 0 29px;
            color: #586860;
            font-family: var(--serif);
            font-size: 20px;
            line-height: 1.65;
        }

        .ornament {
            display: flex;
            width: 150px;
            align-items: center;
            gap: 12px;
            margin-bottom: 27px;
            color: var(--coral);
            font-size: 14px;
        }

        .ornament::before,
        .ornament::after {
            height: 1px;
            flex: 1;
            background: #cbbfae;
            content: '';
        }

        .invitation__date {
            margin: 0;
            font-family: var(--serif);
            font-size: 31px;
        }

        .invitation__weekday {
            margin: 0 0 7px;
            color: var(--coral);
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .invitation__venue {
            margin: 34px 0 0;
            font-family: var(--serif);
            font-size: 22px;
            line-height: 1.5;
        }

        .invitation__location {
            margin: 5px 0 0;
            color: #586860;
            font-size: 12px;
            letter-spacing: 0.05em;
        }

        .invitation__closing {
            margin: 48px 0 0;
            color: #586860;
            font-family: var(--serif);
            font-size: 17px;
            font-style: italic;
        }

        @media (max-width: 520px) {
            body {
                padding: 76px 12px 18px;
            }

            .toolbar {
                right: 12px;
                left: 12px;
                justify-content: flex-end;
            }

            .invitation {
                min-height: 680px;
                padding: 58px 25px;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 14mm;
            }

            body {
                display: block;
                min-height: auto;
                padding: 0;
                background: #fff;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }

            .toolbar {
                display: none;
            }

            .invitation {
                width: 100%;
                min-height: 268mm;
                padding: 25mm 18mm;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar" aria-label="Invitation actions">
        <a href="Index.html">Wedding website</a>
        <button type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>
    <main class="invitation">
        <p class="eyebrow">With joyful hearts</p>
        <h1>Ruth <span>&amp;</span> Kevin</h1>
        <p class="invitation__message">invite you to join them as they celebrate their wedding day.</p>
        <div class="ornament" aria-hidden="true">✳</div>
        <p class="invitation__weekday">Saturday</p>
        <p class="invitation__date"><time datetime="2026-11-21">November 21, 2026</time></p>
        <p class="invitation__venue">Redeemed Gospel Church</p>
        <p class="invitation__location">Rongo, Migori County</p>
        <p class="invitation__closing">We look forward to celebrating with you.</p>
    </main>
</body>
</html>
